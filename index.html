  <style>
    :root{
      --bg:#0b0f14;
      --card:#101826;
      --card2:#0f1722;
      --text:#eaf2ff;
      --muted:#a9b7cc;
      --line:rgba(255,255,255,.10);
      --accent:#17e0c1;
      --accent2:#ff5a3c;
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      line-height:1.45;
      overflow-x:hidden;
      background: var(--bg);
    }
    a{color:inherit}

    /* ===== Premium animated background (subtle, professional) ===== */
    .bg-wrap{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
      background:
        radial-gradient(1200px 700px at 10% 10%, rgba(23,224,193,.18), transparent 60%),
        radial-gradient(900px 600px at 90% 25%, rgba(255,90,60,.14), transparent 55%),
        radial-gradient(900px 600px at 40% 90%, rgba(23,224,193,.10), transparent 60%),
        linear-gradient(180deg, #070a10 0%, #0b0f14 35%, #070a10 100%);
    }

    .blob{
      position:absolute;
      width:700px;
      height:700px;
      border-radius:50%;
      filter: blur(70px);
      opacity:.55;
      transform: translate3d(0,0,0);
      mix-blend-mode: screen;
      animation: floaty 18s ease-in-out infinite;
      will-change: transform;
    }
    .blob.b1{left:-200px; top:-220px; background:rgba(23,224,193,.28); animation-duration: 22s;}
    .blob.b2{right:-260px; top:-140px; background:rgba(255,90,60,.22); animation-duration: 26s;}
    .blob.b3{left:18%; bottom:-330px; background:rgba(23,224,193,.18); animation-duration: 24s;}
    .blob.b4{right:12%; bottom:-380px; background:rgba(120,140,255,.14); animation-duration: 28s;}

    @keyframes floaty{
      0%   { transform: translate3d(0,0,0) scale(1); }
      25%  { transform: translate3d(60px, -40px, 0) scale(1.05); }
      50%  { transform: translate3d(-40px, 70px, 0) scale(0.98); }
      75%  { transform: translate3d(30px, 40px, 0) scale(1.04); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    /* Soft vignette to blend everything */
    .vignette{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(1200px 700px at 50% 10%, rgba(255,255,255,.06), transparent 65%),
        radial-gradient(1200px 900px at 50% 80%, rgba(0,0,0,.45), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.45));
    }

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;

    }

      font-size:13px;font-weight:800;
    }

    .hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
