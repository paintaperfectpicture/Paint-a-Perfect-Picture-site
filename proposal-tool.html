:root {
  --ink: #0f0e0c;
  --paper: #f5f0e8;
  --cream: #ede7d9;
  --gold: #c9a84c;
  --sage: #4a5c4e;
  --line: rgba(15,14,12,0.12);
}

html, body {
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 100;
  opacity: 0.6;
}

.page {
  max-width: 860px;
  margin: 0 auto;
  padding: 60px 40px 120px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 64px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
  animation: fadeUp 0.6s ease both;
}

.wordmark {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.wordmark span { color: var(--gold); }

.tagline {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--sage);
  opacity: 0.8;
}

.dot {
  margin-left: auto;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
  animation: pulse 2s ease infinite;
}

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--line);
  background: white;
  box-shadow: 4px 4px 0 var(--ink);
  animation: fadeUp 0.7s 0.1s ease both;
}

.field {
  position: relative;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.field:nth-child(2) { border-right: none; }
.field.full { grid-column: 1 / -1; border-right: none; }
.field.no-bottom { border-bottom: none; }

.field label {
  display: block;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sage);
  padding: 16px 20px 0;
  font-weight: 500;
}

.field input,
.field textarea {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem;
  color: var(--ink);
  padding: 8px 20px 20px;
  resize: none;
  line-height: 1.6;
}
.field textarea { min-height: 120px; }

.field input::placeholder,
.field textarea::placeholder { color: rgba(15,14,12,0.25); }

.field input:focus ~ .focus-bar,
.field textarea:focus ~ .focus-bar { width: 100%; }

.focus-bar {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px; width: 0;
  background: var(--gold);
  transition: width 0.3s ease;
}

.tone-row {
  grid-column: 1 / -1;
  border-right: none;
  padding: 16px 20px 20px;
  border-bottom: none;
}
.tone-row label {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sage);
  display: block;
  margin-bottom: 12px;
}
.tone-options { display: flex; gap: 8px; flex-wrap: wrap; }

.tone-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  padding: 6px 14px;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.2s;
}
.tone-btn:hover { background: var(--cream); }
.tone-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.submit-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 28px;
  animation: fadeUp 0.7s 0.2s ease both;
}

.btn-generate {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-style: italic;
  background: var(--ink);
  color: var(--paper);
  border: none;
  padding: 16px 36px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--gold);
  transition: all 0.2s;
}
.btn-generate:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--gold); }
.btn-generate:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--gold); }
.btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.status-text {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--sage);
  opacity: 0;
  transition: opacity 0.3s;
}
.status-text.visible { opacity: 1; }

.typing { display: inline-flex; gap: 4px; align-items: center; }
.typing span {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--gold);
  animation: blink 1s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

#output {
  margin-top: 56px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s ease;
}
#output.visible { opacity: 1; transform: translateY(0); }

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--ink);
  color: var(--paper);
}
.output-header-left { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; }
.output-header-right { display: flex; gap: 8px; }

.btn-small {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  padding: 5px 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: transparent;
  color: var(--paper);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-small:hover { background: rgba(255,255,255,0.1); }

.proposal-body {
  background: white;
  border: 1px solid var(--line);
  border-top: none;
  box-shadow: 4px 4px 0 var(--ink);
  padding: 40px 48px;
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  line-height: 1.9;
  color: var(--ink);
  white-space: pre-wrap;
  min-height: 200px;
}

.proposal-body .cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--gold);
  vertical-align: text-bottom;
  animation: blink-cursor 0.7s step-end infinite;
}
@keyframes blink-cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ornament {
  text-align: center;
  font-size: 1.2rem;
  color: var(--gold);
  opacity: 0.5;
  margin: 40px 0 0;
  letter-spacing: 0.5em;
}

@media (max-width: 600px) {
  .page { padding: 40px 20px 80px; }
  .form-grid { grid-template-columns: 1fr; }
  .field { border-right: none; }
  .proposal-body { padding: 28px 24px; }
}

  </div>

  <script>
    let selectedTone = 'professional';

    const toneDescriptions = {
      professional: 'professional and polished',
      friendly: 'warm, friendly, and approachable',
      bold: 'bold, confident, and compelling',
      formal: 'formal and corporate',
      concise: 'concise and to-the-point'
    };

    document.querySelectorAll('.tone-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTone = btn.dataset.tone;
      });
    });

    const generateBtn = document.getElementById('generateBtn');
    const statusEl    = document.getElementById('statusText');
    const outputEl    = document.getElementById('output');
    const proposalEl  = document.getElementById('proposalText');

    generateBtn.addEventListener('click', async () => {
      const projectName = document.getElementById('projectName').value.trim();
      const scope       = document.getElementById('scope').value.trim();
      const estimate    = document.getElementById('estimate').value.trim();

      if (!projectName || !scope) {
        showStatus('Please fill in the project name and scope.');
        return;
      }

      generateBtn.disabled = true;
      proposalEl.innerHTML = '';
      outputEl.classList.remove('visible');
      showStatus('<span class="typing"><span></span><span></span><span></span></span> Drafting your proposal…');

      try {
        // Calls the Netlify serverless function — your API key stays secret on the server
        const response = await fetch('/.netlify/functions/generateProposal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectName, scope, estimate, tone: selectedTone })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `Server error ${response.status}`);
        }

        const data = await response.json();
        const text = data.proposal || 'No proposal returned. Please try again.';

        outputEl.classList.add('visible');
        statusEl.classList.remove('visible');
        generateBtn.disabled = false;

        await typeWriter(proposalEl, text);

      } catch (err) {
        showStatus('Error: ' + err.message);
        generateBtn.disabled = false;
      }
    });

    async function typeWriter(el, text) {
      el.innerHTML = '';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);
      const chunkSize = 3;
      for (let i = 0; i < text.length; i += chunkSize) {
        el.insertBefore(document.createTextNode(text.slice(i, i + chunkSize)), cursor);
        await new Promise(r => setTimeout(r, 18));
      }
      cursor.remove();
    }

    function showStatus(html) {
      statusEl.innerHTML = html;
      statusEl.classList.add('visible');
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(proposalEl.innerText).then(() => {
        const cb = document.getElementById('copyBtn');
        cb.textContent = 'Copied!';
        setTimeout(() => cb.textContent = 'Copy', 2000);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      outputEl.classList.remove('visible');
      proposalEl.innerHTML = '';
    });
  </script>
